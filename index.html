  <header class="titulo">
    <h2>Bem vindo ao guia turistico de Touros-RN</h2>
    <h3>aqui vou abordar sobre centros historicos e atrações </h3>

</style>

<h1>Pontos Turisticos</h1>
    
<div class="gallery">
  <img src="farol de touros.webp" alt="farol de Touros-RN" class="gallery-item" onclick="openModal('modal1', 'farol do calcanhar')" width="600" height="400">
  <img src="canhões.webp" alt="canhões" class="gallery-item" onclick="openModal('modal2', 'Canhões')" width="600" height="400">
  <img src="igreja.webp" alt="igreja" class="gallery-item" onclick="openModal('modal3', 'igreja ')" width="600" height="400">
  <img src="Marco Zero.webp" alt="Marco Zero" class="gallery-item" onclick="openModal('modal4', 'Marco Zero')" width="600" height="400">
</div>

<div id="modal1" class="modal">
  <span class="close" onclick="closeModal('modal1')">&times;</span>
  <img src="farol de touros.webp" alt="Cinque Terre" class="modal-content" width="600" height="400">
  <div class="caption"></div>
</div>



<div id="modal2" class="modal">
  <span class="close" onclick="closeModal('modal2')">&times;</span>
  <img src="canhões.webp" alt="Forest" class="modal-content" width="600" height="400">
  <div class="caption"></div>
</div>



<div id="modal3" class="modal">
  <span class="close" onclick="closeModal('modal3')">&times;</span>
  <img src="igreja.webp" alt="Northern Lights" class="modal-content" width="600" height="400">
  <div class="caption"></div>
</div>

<div id="modal4" class="modal">
  <span class="close" onclick="closeModal('modal4')">&times;</span>
  <img src="Marco Zero.webp" alt="Marco Zero" class="modal-content" width="600" height="400">
  <div class="caption"></div>
</div>

<script>
function openModal(modalId, caption) {
  let modal = document.getElementById(modalId);
  modal.style.display = "flex";
  modal.classList.add("show");
  let message = modal.querySelector(".caption");
  message.innerText = caption;
}

function closeModal(modalId) {
  let modal = document.getElementById(modalId);
  modal.classList.remove("show");
  setTimeout(function () {
    modal.style.display = "none";
    modal.querySelector(".caption").innerText = "";
  }, 300);

}
</script>
